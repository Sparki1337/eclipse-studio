[package]
name = "eclipse-hv"
version = "1.1.0"
edition = "2021"
description = "Eclipse-HV: универсальный автономный лаунчер игр с обходом DSE и поддержкой Secure Boot"
authors = ["Sparki"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.55"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
